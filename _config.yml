# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Sebastian Benthall, PhD
author: Sebastian Benthall
# Short; appended to the site title in <title>. Keep it brief or tabs get unreadable.
tagline: Fiduciary AI, causal economic modeling, and privacy
description: >- # this means to ignore newlines until "baseurl:"
  Research Director at NYU's Information Law Institute and Research Scientist at
  ICSI, working on causal economic modeling, fiduciary AI, and privacy.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://sbenthall.net" # the base hostname & protocol for your site, e.g. http://example.com

# jekyll-seo-tag reads `image` per page, not site-wide, so set it as a default.
# This is the picture shown when a link to the site is shared.
defaults:
  - scope:
      path: ""
    values:
      image: /sebastian-benthall.jpg

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing.
# NOTE: setting this key REPLACES Jekyll's built-in default list rather than
# adding to it, so the defaults below must be repeated or Gemfile, Gemfile.lock
# and friends get copied into _site.
exclude:
  - .jekyll-cache/
  - .sass-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Internal working notes, not for publication. design.md has no front matter,
  # which means Jekyll would otherwise copy it verbatim to /design.md.
  - design.md
